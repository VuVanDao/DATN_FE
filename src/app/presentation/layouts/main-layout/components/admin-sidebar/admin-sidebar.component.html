<!-- ===== ADMIN SIDEBAR ===== -->
<aside
  class="h-full bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0 z-30 select-none overflow-hidden transition-all duration-200"
  [class.w-60]="!layoutService.isSidebarCollapsed()" [class.w-18]="layoutService.isSidebarCollapsed()">
  <!-- Header: Tiêu đề Quản trị hệ thống + Nút quay về -->
  <div class="pt-5 pb-4 border-b border-slate-100 dark:border-slate-800/80 transition-all duration-200"
    [class.px-4]="!layoutService.isSidebarCollapsed()" [class.px-2]="layoutService.isSidebarCollapsed()">
    <!-- Nút Quay lại Trang chủ -->
    <div class="flex items-center mb-3.5" [class.gap-2]="!layoutService.isSidebarCollapsed()"
      [class.justify-center]="layoutService.isSidebarCollapsed()">
      <button type="button" (click)="navigateBack()" matTooltip="Quay lại trang chính"
        [matTooltipPosition]="layoutService.isSidebarCollapsed() ? 'right' : 'above'"
        class="h-7 rounded-lg flex items-center gap-1 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition cursor-pointer shrink-0">
        <mat-icon fontIcon="arrow_back" class="icon-xs"></mat-icon>
        @if(!layoutService.isSidebarCollapsed()){
        <span class="text-sm font-medium">Quay lại</span>
        }
      </button>
    </div>

    <!-- Huy hiệu Quản trị viên Cấp cao -->
    <div class="flex items-center" [class.gap-3]="!layoutService.isSidebarCollapsed()"
      [class.justify-center]="layoutService.isSidebarCollapsed()">
      <div
        class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0"
        [matTooltip]="layoutService.isSidebarCollapsed() ? 'Quản trị hệ thống' : ''" matTooltipPosition="right">
        <mat-icon fontIcon="security" class="icon-sm"></mat-icon>
      </div>
      @if (!layoutService.isSidebarCollapsed()) {
      <div class="min-w-0">
        <p class="text-sm font-bold text-slate-900 dark:text-white truncate flex items-center gap-1.5">
          Admin Portal
          <span
            class="px-1.5 py-0.5 text-[9px] bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 font-semibold rounded">ROOT</span>
        </p>
        <p class="text-[11px] text-slate-400 dark:text-slate-500 truncate">
          Quản trị toàn hệ thống
        </p>
      </div>
      }
    </div>
  </div>

  <!-- Tiêu đề mục quản trị -->
  @if (!layoutService.isSidebarCollapsed()) {
  <div class="px-4 pt-4 pb-2">
    <p class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
      Danh mục Quản trị
    </p>
  </div>
  } @else {
  <div class="my-2 border-t border-slate-100 dark:border-slate-800"></div>
  }

  <!-- Navigation Menu Tabs -->
  <nav class="space-y-1 flex-1" [class.px-3]="!layoutService.isSidebarCollapsed()"
    [class.px-2]="layoutService.isSidebarCollapsed()">
    <!-- 1. Quản lý người dùng (Active Tab) -->
    <a routerLink="/admin/users"
      routerLinkActive="bg-indigo-50 dark:bg-indigo-600/15 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/25 font-semibold shadow-xs"
      [routerLinkActiveOptions]="{ exact: true }"
      [matTooltip]="layoutService.isSidebarCollapsed() ? 'Quản lý người dùng' : ''" matTooltipPosition="right"
      class="w-full flex items-center gap-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/70 transition cursor-pointer"
      [class.px-3.5]="!layoutService.isSidebarCollapsed()" [class.px-0]="layoutService.isSidebarCollapsed()"
      [class.justify-center]="layoutService.isSidebarCollapsed()">
      <mat-icon fontIcon="manage_accounts" class="icon-sm shrink-0"></mat-icon>
      @if (!layoutService.isSidebarCollapsed()) {
      <span class="truncate">Người dùng</span>
      }
    </a>

    <!-- 2. Lịch sử đăng nhập & Bảo mật -->
    <a routerLink="/security"
      routerLinkActive="bg-indigo-50 dark:bg-indigo-600/15 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/25 font-semibold shadow-xs"
      [routerLinkActiveOptions]="{ exact: true }"
      [matTooltip]="layoutService.isSidebarCollapsed() ? 'Nhật ký bảo mật' : ''" matTooltipPosition="right"
      class="w-full flex items-center gap-3 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/70 transition cursor-pointer"
      [class.px-3.5]="!layoutService.isSidebarCollapsed()" [class.px-0]="layoutService.isSidebarCollapsed()"
      [class.justify-center]="layoutService.isSidebarCollapsed()">
      <mat-icon fontIcon="shield" class="icon-sm shrink-0"></mat-icon>
      @if (!layoutService.isSidebarCollapsed()) {
      <span class="truncate">Bảo mật hệ thống</span>
      }
    </a>
  </nav>
</aside>
