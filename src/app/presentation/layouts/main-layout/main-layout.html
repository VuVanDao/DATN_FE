<div
  class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex flex-col transition-colors duration-200"
>
  <!-- Top Navigation Bar -->
  <app-main-header />

  <!-- Body: Dynamic Left Sidebar + Main Content + Right AI Drawer -->
  <div class="flex-1 flex overflow-hidden relative">
    <!-- Dynamic Left Sidebar: Chuyển đổi linh hoạt giữa các loại Sidebar -->
    @switch (layoutService.activeSidebar()) {
      @case ('main') {
        <app-main-sidebar />
      }
      <!-- @case ('board') { <app-board-sidebar /> } -->
      <!-- @case ('workspace') { <app-workspace-sidebar /> } -->
    }

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-6 transition-all duration-200">
      <div class="max-w-7xl mx-auto w-full">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Right AI Assistant Drawer -->
    @if (layoutService.isAiDrawerOpen()) {
      <app-ai-drawer />
    }
  </div>
</div>
