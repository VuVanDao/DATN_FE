<div class="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
  <!-- Top Navigation Bar -->
  <header
    class="h-16 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 px-6 flex items-center justify-between sticky top-0 z-50"
  >
    <!-- Logo & Nhãn hiệu -->
    <div class="flex items-center gap-3">
      <a routerLink="/" class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/20"
        >
          T
        </div>
        <span class="font-bold text-white text-lg tracking-tight">TrelloClone</span>
      </a>
      <span
        class="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full font-medium border border-slate-700"
      >
        Workspace
      </span>
    </div>

    <!-- Phía bên phải: Chuông thông báo & Avatar Dropdown -->
    <div class="flex items-center gap-3 relative">
      <!-- Nút Avatar kích hoạt Dropdown -->
      <button
        (click)="toggleDropdown()"
        class="flex items-center gap-2.5 p-1 rounded-xl hover:bg-slate-800 transition cursor-pointer border border-transparent hover:border-slate-700"
      >
        <!-- Avatar tròn -->
        <div
          class="w-9 h-9 rounded-full bg-linear-to-tr from-blue-600 to-indigo-500 text-white font-semibold flex items-center justify-center text-sm shadow-sm ring-2 ring-slate-700"
        >
          {{ authStore.currentUser()?.UserName?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
        <!-- Mũi tên nhỏ -->
        <svg
          class="w-4 h-4 text-slate-400 transition-transform duration-200"
          [class.rotate-180]="isDropdownOpen()"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <!-- DROPDOWN MENU (GIỐNG ẢNH 1) -->
      @if (isDropdownOpen()) {
        <!-- Lớp phủ tàng hình để bấm ra ngoài thì đóng menu -->
        <div (click)="closeDropdown()" class="fixed inset-0 z-40"></div>

        <!-- Khung Dropdown -->
        <div
          class="absolute right-0 top-12 w-64 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-50 p-2 text-sm animate-in fade-in zoom-in-95 duration-150"
        >
          <!-- Phần thông tin User -->
          <div class="p-3 border-b border-slate-800/80 mb-1">
            <p class="font-bold text-white text-sm truncate">
              {{ authStore.currentUser()?.UserName }}
            </p>
            <p class="text-xs text-slate-400 truncate mt-0.5">
              {{ authStore.currentUser()?.Email }}
            </p>
          </div>

          <!-- Menu items -->
          <div class="space-y-0.5">
            <!-- 1. Hồ sơ cá nhân -->
            <button
              (click)="closeDropdown()"
              class="w-full flex items-center gap-3 px-3 py-2 text-slate-300 hover:text-white hover:bg-slate-800/70 rounded-xl transition cursor-pointer text-left"
            >
              <svg
                class="w-4 h-4 text-slate-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
              <span>Hồ sơ cá nhân</span>
            </button>

            <!-- 2. Cài đặt (Chuyển sang trang Cài đặt) -->
            <button
              (click)="navigateToSettings()"
              class="w-full flex items-center gap-3 px-3 py-2 text-slate-300 hover:text-white hover:bg-slate-800/70 rounded-xl transition cursor-pointer text-left"
            >
              <svg
                class="w-4 h-4 text-slate-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              <span>Cài đặt</span>
            </button>
          </div>

          <!-- Divider -->
          <div class="my-1 border-t border-slate-800"></div>

          <!-- 3. Đăng xuất -->
          <button
            (click)="onLogOut()"
            class="w-full flex items-center gap-3 px-3 py-2 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl transition cursor-pointer text-left"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
            <span>Đăng xuất</span>
          </button>
        </div>
      }
    </div>
  </header>

  <!-- Nội dung trang con -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
