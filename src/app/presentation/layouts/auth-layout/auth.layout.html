<div class="min-h-screen w-full flex bg-[#0f172a] text-slate-100 font-sans">
  <!-- phía bên trái các trang auth -->
  <app-auth-left [isRecoveryMode]="isRecoveryMode()" class="hidden lg:flex lg:w-1/2" />

  <!-- bên phải các trang auth -->
  <main class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-10 bg-[#0f172a]">
    <div class="w-full max-w-sm">
      <!-- Mobile logo (shown only on small screens) -->
      <div class="lg:hidden flex items-center gap-2 mb-10 justify-center">
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center bg-gradient-to-br from-indigo-400 to-purple-400 shadow-lg shadow-indigo-500/30"
        >
          <mat-icon
            fontIcon="bolt"
            class="icon-xs text-white flex items-center justify-center"
          ></mat-icon>
        </div>
        <span class="font-semibold tracking-tight text-white">TaskFlow AI</span>
      </div>

      <!-- router các trang đăng nhập, đăng kí, quên mật khẩu-->
      <router-outlet></router-outlet>

      <!-- Footer note -->
      <p class="mt-10 text-xs text-center text-slate-500">
        Đồ Án Tốt Nghiệp • Hệ Thống Quản Lý Dự Án Và Công Việc
      </p>
    </div>
  </main>
</div>
