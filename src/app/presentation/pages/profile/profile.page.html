<div class="max-w-5xl mx-auto space-y-5 pb-6">
  <!-- Page Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
        Hồ sơ cá nhân
      </h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">
        Quản lý thông tin tài khoản và tùy chỉnh hồ sơ cá nhân của bạn.
      </p>
    </div>
  </div>

  @if (profileStore.isProfileLoading() || !profileStore.currentUser()) {
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch animate-pulse">
      <!-- CỘT TRÁI SKELETON (4/12 - Căn giữa, không còn chân ID) -->
      <div
        class="lg:col-span-4 h-full min-h-[380px] flex flex-col items-center justify-center text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm"
      >
        <!-- Avatar Skeleton (To hơn & Bo góc) -->
        <div
          class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-slate-200 dark:bg-slate-800 mb-4 shadow-inner"
        ></div>

        <!-- Tên Skeleton -->
        <div class="h-6 w-44 bg-slate-200 dark:bg-slate-800 rounded-lg mb-2"></div>

        <!-- Email Skeleton -->
        <div class="h-4 w-48 bg-slate-100 dark:bg-slate-800/60 rounded-lg mb-4"></div>

        <!-- Badges Skeleton -->
        <div class="flex items-center justify-center gap-2">
          <div class="h-6 w-24 rounded-full bg-slate-200 dark:bg-slate-800"></div>
          <div class="h-6 w-24 rounded-full bg-slate-100 dark:bg-slate-800/60"></div>
        </div>
      </div>

      <!-- CỘT PHẢI SKELETON (8/12) -->
      <div
        class="lg:col-span-8 h-full min-h-[380px] flex flex-col justify-between bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden"
      >
        <!-- Card Header Skeleton -->
        <div
          class="px-6 py-4 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between shrink-0"
        >
          <div class="space-y-1.5">
            <div class="h-5 w-36 bg-slate-200 dark:bg-slate-800 rounded-lg"></div>
            <div class="h-3.5 w-60 bg-slate-100 dark:bg-slate-800/60 rounded-lg"></div>
          </div>
          <!-- Button Chỉnh sửa Skeleton -->
          <div class="h-8 w-24 bg-slate-100 dark:bg-slate-800/70 rounded-xl"></div>
        </div>

        <!-- Content Body Skeleton -->
        <div class="p-5 flex-1 flex flex-col justify-between space-y-3.5">
          <!-- Grid 4 ô chi tiết -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div
              class="bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 rounded-xl p-3 space-y-2"
            >
              <div class="h-3 w-16 bg-slate-200 dark:bg-slate-700/60 rounded"></div>
              <div class="h-4 w-32 bg-slate-200 dark:bg-slate-700 rounded"></div>
            </div>

            <div
              class="bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 rounded-xl p-3 space-y-2"
            >
              <div class="h-3 w-20 bg-slate-200 dark:bg-slate-700/60 rounded"></div>
              <div class="h-4 w-40 bg-slate-200 dark:bg-slate-700 rounded"></div>
            </div>

            <div
              class="bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 rounded-xl p-3 space-y-2"
            >
              <div class="h-3 w-28 bg-slate-200 dark:bg-slate-700/60 rounded"></div>
              <div class="h-5 w-24 bg-slate-200 dark:bg-slate-700 rounded-md"></div>
            </div>

            <div
              class="bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 rounded-xl p-3 space-y-2"
            >
              <div class="h-3 w-24 bg-slate-200 dark:bg-slate-700/60 rounded"></div>
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                <div class="h-4 w-36 bg-slate-200 dark:bg-slate-700 rounded"></div>
              </div>
            </div>
          </div>

          <!-- Ô Giới thiệu bản thân Skeleton -->
          <div
            class="bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 rounded-xl p-3.5 flex-1 flex flex-col justify-center space-y-2"
          >
            <div class="h-3 w-28 bg-slate-200 dark:bg-slate-700/60 rounded mb-1"></div>
            <div class="h-3.5 w-full bg-slate-200 dark:bg-slate-700 rounded"></div>
            <div class="h-3.5 w-4/5 bg-slate-100 dark:bg-slate-800/60 rounded"></div>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
      <!-- Cột Trái -->
      <app-profile-overview class="lg:col-span-4 h-full block" />

      <!-- Cột Phải -->
      <app-profile-details class="lg:col-span-8 h-full block" />
    </div>

    <app-login-history class="block" />
  }
</div>
