<!-- 6. MODAL PHÂN QUYỀN (ASSIGN ROLES) -->
@if (user()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs animate-in fade-in duration-150"
  >
    <div
      class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-md w-full shadow-2xl overflow-hidden animate-in zoom-in-95 duration-150"
    >
      <!-- Modal Header -->
      <div
        class="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between"
      >
        <div class="flex items-center gap-2.5">
          <div
            class="w-8 h-8 rounded-lg bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 flex items-center justify-center"
          >
            <mat-icon fontIcon="verified_user" class="icon-sm"></mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 dark:text-white text-base">Phân quyền vai trò</h3>
            <p class="text-xs text-slate-400">{{ user()?.email }}</p>
          </div>
        </div>
        <button
          type="button"
          (click)="closed.emit()"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
        >
          <mat-icon fontIcon="close" class="icon-sm"></mat-icon>
        </button>
      </div>

      <!-- Modal Body: Danh sách chọn Role Toàn cục -->
      <div class="p-5 space-y-3 max-h-80 overflow-y-auto">
        @for (role of roles(); track role.id) {
          <label
            (click)="selectedRoleId.set(role.id)"
            class="flex items-start gap-3 p-3 rounded-xl border transition cursor-pointer"
            [class.border-indigo-500]="selectedRoleId() === role.id"
            [class.bg-indigo-50/50]="selectedRoleId() === role.id"
            [class.dark:bg-indigo-900/10]="selectedRoleId() === role.id"
            [class.border-slate-200]="selectedRoleId() !== role.id"
            [class.dark:border-slate-800]="selectedRoleId() !== role.id"
          >
            <input
              type="radio"
              name="userGlobalRole"
              [checked]="selectedRoleId() === role.id"
              class="mt-1 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
            />
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ role.name }}</p>
              <p class="text-xs text-slate-400 mt-0.5">
                {{ role.description || 'Không có mô tả' }}
              </p>
            </div>
          </label>
        }
      </div>

      <!-- Modal Footer -->
      <div
        class="p-4 bg-slate-50/80 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-2.5"
      >
        <button
          type="button"
          (click)="closed.emit()"
          class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 rounded-xl transition cursor-pointer"
        >
          Hủy
        </button>
        <button
          type="button"
          (click)="saveRoles()"
          [disabled]="submitting()"
          class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs transition cursor-pointer disabled:opacity-50"
        >
          {{ submitting() ? 'Đang lưu...' : 'Lưu thay đổi' }}
        </button>
      </div>
    </div>
  </div>
}
