<div
  class="w-full shrink-0 max-h-full flex flex-col justify-between rounded-2xl bg-slate-200/60 dark:bg-[#111827]/90 border border-slate-300/70 dark:border-slate-800/80 shadow-sm dark:shadow-xl backdrop-blur-xs overflow-hidden text-slate-800 dark:text-slate-100"
  [class.min-h-[92px]]="column().cards.length === 0"
>
  <!-- Column Header -->
  <div
    cdkDragHandle
    [cdkDragHandleDisabled]="isEditingTitle()"
    class="px-3 pt-2.5 pb-1 flex items-center justify-between gap-2 shrink-0 cursor-grab active:cursor-grabbing select-none"
  >
    @if (isEditingTitle()) {
      <div class="flex-1 min-w-0 pr-1">
        <input
          #titleInput
          type="text"
          [ngModel]="editingTitleValue()"
          (ngModelChange)="editingTitleValue.set($event)"
          (keydown.enter)="saveTitle()"
          (keydown.escape)="cancelEditingTitle()"
          (blur)="cancelEditingTitle()"
          class="w-full bg-white dark:bg-slate-900 border-2 border-indigo-500/90 dark:border-indigo-500 rounded-lg px-2 py-0.5 text-xs sm:text-sm font-bold text-slate-900 dark:text-white outline-hidden shadow-xs transition"
        />
      </div>
    } @else {
      <div
        (click)="startEditingTitle()"
        class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer group py-0.5 px-1.5 -mx-1.5 rounded-lg hover:bg-slate-300/40 dark:hover:bg-slate-800/50 transition"
        title="Nhấp để đổi tên danh sách"
      >
        <h2 class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white truncate">
          {{ column().title }}
        </h2>
      </div>
    }

    <!-- Right: Card Count & Menu Button -->
    <div class="flex items-center gap-1 shrink-0">
      @if (column().isDoneColumn) {
        <span
          class="text-[10px] font-medium px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/20 shrink-0"
          title="Cột hoàn thành"
        >
          <mat-icon fontIcon="check_circle" class="text-xs! w-3! h-3!"></mat-icon>
        </span>
      }
      <span
        class="text-xs font-semibold text-slate-400 dark:text-slate-500 px-1 select-none"
        [title]="column().cards.length + ' thẻ'"
      >
        {{ column().cards.length }}
      </span>
      <button
        #menuTrigger="cdkOverlayOrigin"
        cdkOverlayOrigin
        type="button"
        (click)="toggleMenu()"
        class="p-1 rounded-md text-slate-400 hover:text-slate-800 hover:bg-slate-300/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-700/60 transition cursor-pointer"
        [class.bg-slate-300/60]="isMenuOpen()"
        [class.dark:bg-slate-700/60]="isMenuOpen()"
        [class.text-slate-800]="isMenuOpen()"
        [class.dark:text-white]="isMenuOpen()"
        title="Tùy chọn danh sách"
        aria-label="Tùy chọn danh sách"
      >
        <mat-icon fontIcon="more_horiz" class="text-xs! w-4! h-4!"></mat-icon>
      </button>

      <!-- Trello-like List Actions Menu (CDK Connected Overlay) -->
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="menuTrigger"
        [cdkConnectedOverlayOpen]="isMenuOpen()"
        [cdkConnectedOverlayHasBackdrop]="true"
        cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
        [cdkConnectedOverlayPositions]="overlayPositions"
        (backdropClick)="closeMenu()"
      >
        <div
          class="w-72 bg-white dark:bg-[#282e33] border border-slate-200 dark:border-[#38414a] rounded-xl shadow-2xl overflow-hidden py-1.5 text-slate-700 dark:text-[#b6c2cf] animate-in fade-in zoom-in-95 duration-100 select-none z-50"
        >
          <!-- Menu Header: Centered title and close button -->
          <div
            class="relative px-4 py-2 border-b border-slate-200/80 dark:border-[#38414a] flex items-center justify-center"
          >
            <h3 class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-[#9fadbc]">
              List actions
            </h3>
            <button
              type="button"
              (click)="closeMenu()"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 rounded-md text-slate-400 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700/50 transition cursor-pointer"
              title="Đóng menu"
              aria-label="Đóng menu"
            >
              <mat-icon fontIcon="close" class="text-xs! w-3.5! h-3.5!"></mat-icon>
            </button>
          </div>

          <!-- Menu Action Items -->
          <div class="p-2 space-y-0.5">
            <!-- Add card -->
            <button
              type="button"
              (click)="onAddCardFromMenu()"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white transition flex items-center justify-between cursor-pointer"
            >
              <span>Thêm thẻ mới</span>
            </button>

            <!-- Toggle Done Column (Đánh dấu là đã xong) -->
            <button
              type="button"
              (click)="onToggleDoneColumn()"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm transition flex items-center justify-between cursor-pointer group"
              [class]="
                column().isDoneColumn
                  ? 'text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-950/30'
                  : 'text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white'
              "
            >
              <span class="flex items-center gap-2">
                @if (column().isDoneColumn) {
                  <mat-icon
                    fontIcon="check_circle"
                    class="icon-xxs text-emerald-500 shrink-0"
                  ></mat-icon>
                  <span class="translate-y-px">Cột đã xong (Bỏ đánh dấu)</span>
                } @else {
                  <mat-icon
                    fontIcon="radio_button_unchecked"
                    class="icon-xxs text-slate-400 group-hover:text-emerald-500 shrink-0 transition-colors translate-y-px"
                  ></mat-icon>
                  <span>Đánh dấu là đã xong</span>
                }
              </span>
              @if (column().isDoneColumn) {
                <span
                  class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300"
                >
                  Done
                </span>
              }
            </button>

            <!-- Xoá cột này -->
            <button
              type="button"
              (click)="onDeleteColumn()"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-700 dark:hover:text-red-300 transition flex items-center gap-2 cursor-pointer group"
            >
              <mat-icon
                fontIcon="delete_outline"
                class="icon-xxs text-red-500 shrink-0 translate-y-px"
              ></mat-icon>
              <span>Xoá cột này</span>
            </button>

            <!-- Move list -->
            <button
              type="button"
              (click)="onPlaceholderAction('Move list')"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white transition flex items-center justify-between cursor-pointer"
            >
              <span>Move list</span>
            </button>

            <!-- Move all cards in this list -->
            <button
              type="button"
              (click)="onPlaceholderAction('Move all cards in this list')"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white transition flex items-center justify-between cursor-pointer"
            >
              <span>Move all cards in this list</span>
            </button>

            <div class="my-1 border-t border-slate-200/80 dark:border-[#38414a]"></div>

            <!-- Sort by -->
            <button
              type="button"
              (click)="onPlaceholderAction('Sort by')"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white transition flex items-center justify-between cursor-pointer"
            >
              <span>Sort by</span>
            </button>

            <!-- Pin list -->
            <button
              type="button"
              (click)="onPlaceholderAction('Pin list')"
              class="w-full text-left px-3 py-1.5 rounded-lg text-xs sm:text-sm text-slate-700 dark:text-[#b6c2cf] hover:bg-slate-100 dark:hover:bg-[#333c43] hover:text-slate-900 dark:hover:text-white transition flex items-center justify-between cursor-pointer"
            >
              <span>Pin list</span>
            </button>
          </div>
        </div>
      </ng-template>
    </div>
  </div>

  <!-- Cards Drag & Drop List Container -->
  <div
    cdkDropList
    [id]="column().id"
    [cdkDropListData]="column().cards || []"
    [cdkDropListConnectedTo]="connectedDropLists()"
    (cdkDropListDropped)="onCardDropped($event)"
    class="flex-1 overflow-y-auto px-2.5 no-scrollbar transition-all"
    [class.py-1]="(column().cards || []).length > 0"
    [class.space-y-2.5]="(column().cards || []).length > 0"
    [class.min-h-8]="(column().cards || []).length > 0"
    [class.min-h-0]="(column().cards || []).length === 0"
    [class.py-0]="(column().cards || []).length === 0"
  >
    @for (card of column().cards || []; track card.id) {
      <app-board-card
        cdkDrag
        [cdkDragData]="card"
        [card]="card"
        [isDoneColumn]="column().isDoneColumn"
        (cardClick)="cardClick.emit($event)"
        (deleteCard)="deleteCard.emit($event)"
        (updateTitle)="updateCardTitle.emit($event)"
        (updateCover)="updateCardCover.emit($event)"
        (updateDatesFromCard)="updateCardDatesFromColumn.emit($event)"
        class="block cursor-pointer"
      />
    }
  </div>

  <!-- Column Footer: Add Card / Quick Input Form -->
  <div class="p-2 pt-0.5 shrink-0">
    @if (isActiveAddCard()) {
      <!-- Quick Add Card Form -->
      <div
        class="space-y-2 bg-white dark:bg-[#1f2937] p-2 rounded-xl border border-indigo-500/60 shadow-md animate-in fade-in duration-100"
      >
        <textarea
          #cardTextarea
          [ngModel]="newCardTitle()"
          (ngModelChange)="newCardTitle.set($event)"
          (keydown.enter)="$event.preventDefault(); onConfirmAdd()"
          (keydown.escape)="onCancelAdd()"
          placeholder="Nhập tiêu đề cho thẻ này..."
          rows="2"
          class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs text-slate-900 dark:text-white placeholder:text-slate-400 outline-hidden resize-none focus:border-indigo-500 transition"
        ></textarea>

        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="onConfirmAdd()"
            [disabled]="!newCardTitle().trim() || isAddingCard()"
            class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 text-white text-xs font-semibold cursor-pointer transition shadow-xs inline-flex items-center gap-1.5"
          >
            @if (isAddingCard()) {
              <mat-icon fontIcon="sync" class="text-xs! w-3.5! h-3.5! animate-spin"></mat-icon>
              <span>Đang thêm...</span>
            } @else {
              <span>Thêm thẻ</span>
            }
          </button>
          <button
            type="button"
            (click)="onCancelAdd()"
            class="p-1 rounded-md text-slate-400 hover:text-slate-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700/60 transition cursor-pointer"
            title="Huỷ"
            aria-label="Huỷ"
          >
            <mat-icon fontIcon="close" class="text-sm! w-4! h-4!"></mat-icon>
          </button>
        </div>
      </div>
    } @else {
      <!-- Normal Add a card button -->
      <button
        type="button"
        (click)="onOpenAdd()"
        class="w-full flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold leading-none text-slate-600 hover:text-slate-900 hover:bg-slate-300/50 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800/80 transition cursor-pointer"
      >
        <mat-icon
          fontIcon="add"
          class="icon-xs shrink-0 flex items-center justify-center leading-none"
        ></mat-icon>
        <span class="leading-none inline-block">Thêm thẻ mới</span>
      </button>
    }
  </div>
</div>
