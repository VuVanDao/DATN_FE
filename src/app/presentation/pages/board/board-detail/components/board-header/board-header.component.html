<header
  class="h-13 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md px-4 flex items-center justify-between border-b border-slate-200/80 dark:border-slate-800/80 shrink-0 z-10 shadow-2xs dark:shadow-none"
>
  <!-- Left Section: Board Title, View Switcher & Star Button -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Board Title -->
    <h1
      class="text-base sm:text-lg font-bold text-slate-900 dark:text-white hover:bg-slate-200/60 dark:hover:bg-slate-800/60 px-2.5 py-1 rounded-lg transition cursor-pointer truncate max-w-[200px] sm:max-w-md"
    >
      {{ board()?.title || 'Đang tải bảng...' }}
    </h1>

    <!-- Board View Dropdown Pill (Kanban View Icon) -->
    <button
      type="button"
      class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800/60 transition cursor-pointer"
      title="Dạng xem bảng"
    >
      <mat-icon fontIcon="view_week" class="text-sm! w-4! h-4!"></mat-icon>
      <mat-icon fontIcon="expand_more" class="text-xs! w-3! h-3!"></mat-icon>
    </button>

    <!-- Star / Pin Toggle Button -->
    <button
      type="button"
      (click)="onTogglePin()"
      class="p-1.5 rounded-lg transition cursor-pointer"
      [class]="
        board()?.isPinned
          ? 'text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-500/10'
          : 'text-slate-400 hover:text-amber-500 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-amber-400 dark:hover:bg-slate-800/60'
      "
      [title]="board()?.isPinned ? 'Bỏ ghim bảng' : 'Ghim bảng'"
    >
      <mat-icon
        [fontIcon]="board()?.isPinned ? 'star' : 'star_border'"
        [class.text-amber-500]="board()?.isPinned"
        class="text-base! w-4.5! h-4.5!"
      ></mat-icon>
    </button>

    <!-- Project Name Context Badge -->
    @if (board()?.projectName) {
      <span
        class="hidden md:inline-flex items-center text-xs font-medium text-indigo-700 bg-indigo-50 border border-indigo-200 dark:text-indigo-300 dark:bg-indigo-500/10 dark:border-indigo-500/20 px-2.5 py-0.5 rounded-md"
      >
        {{ board()?.projectName }}
      </span>
    }
  </div>

  <!-- Right Section: Members, Actions & Options -->
  <div class="flex items-center gap-1.5 sm:gap-2">
    <!-- Member Avatars Stack -->
    <div class="flex items-center -space-x-1.5 overflow-hidden pr-1">
      <div
        class="w-7 h-7 rounded-full bg-linear-to-br from-indigo-500 to-purple-600 border-2 border-white dark:border-slate-900 flex items-center justify-center text-[11px] font-bold text-white shadow-xs"
        title="Member"
      >
        MM
      </div>
    </div>

    <!-- Power-Ups Icon -->
    <button
      type="button"
      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800/60 transition cursor-pointer hidden sm:inline-flex"
      title="Power-Ups"
    >
      <mat-icon fontIcon="power" class="text-sm! w-4! h-4!"></mat-icon>
    </button>

    <!-- Automation Icon -->
    <button
      type="button"
      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800/60 transition cursor-pointer hidden sm:inline-flex"
      title="Automation"
    >
      <mat-icon fontIcon="bolt" class="text-sm! w-4! h-4!"></mat-icon>
    </button>

    <!-- Filter Icon -->
    <button
      type="button"
      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800/60 transition cursor-pointer hidden sm:inline-flex"
      title="Filter cards"
    >
      <mat-icon fontIcon="filter_list" class="text-sm! w-4! h-4!"></mat-icon>
    </button>

    <!-- Share Button -->
    <button
      type="button"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold leading-none text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 transition cursor-pointer shadow-sm shadow-indigo-600/20"
    >
      <mat-icon
        fontIcon="person_add"
        class="icon-xs shrink-0 flex items-center justify-center leading-none"
      ></mat-icon>
      <span class="leading-none inline-block">Share</span>
    </button>

    <!-- More Options Menu Dots -->
    <button
      type="button"
      class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800/60 transition cursor-pointer"
      title="Menu"
    >
      <mat-icon fontIcon="more_horiz" class="text-base! w-5! h-5!"></mat-icon>
    </button>
  </div>
</header>
