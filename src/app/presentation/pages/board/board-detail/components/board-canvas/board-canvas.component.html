<!-- Loading State Skeleton -->
@if (isLoading()) {
  <!-- Trạng thái loading -->
  <div class="flex gap-3.5">
    @for (i of [1, 2, 3]; track i) {
      <div
        class="w-72 h-80 rounded-2xl bg-slate-200/70 dark:bg-slate-900/70 animate-pulse border border-slate-300/60 dark:border-slate-800/50 p-3 flex flex-col gap-3"
      >
        <div class="h-6 w-32 bg-slate-300/80 dark:bg-slate-700/60 rounded"></div>
        <div class="h-20 bg-slate-300/50 dark:bg-slate-800/60 rounded-xl"></div>
        <div class="h-16 bg-slate-300/50 dark:bg-slate-800/60 rounded-xl"></div>
      </div>
    }
  </div>
} @else if (error()) {
  <!-- Fallback Error State -->
  <div class="flex-1 w-full h-full self-stretch flex items-center justify-center p-4">
    <div
      class="p-6 bg-white dark:bg-slate-900 border border-rose-300 dark:border-rose-500/40 rounded-2xl shadow-xl text-center max-w-md w-full shadow-rose-500/5"
    >
      <mat-icon
        fontIcon="error_outline"
        class="text-rose-500 dark:text-rose-400 text-3xl! w-8! h-8! mb-2"
      ></mat-icon>
      <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Không thể tải bảng</h3>
      <p class="text-xs text-slate-600 dark:text-slate-300 mb-4">{{ error() }}</p>
      <button
        type="button"
        (click)="retry.emit()"
        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold cursor-pointer shadow-sm transition"
      >
        Thử lại
      </button>
    </div>
  </div>
} @else {
  <div class="flex items-start gap-3.5 h-full">
    <!-- Columns List -->
    <div
      cdkDropList
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="columns()"
      (cdkDropListDropped)="onColumnDrop($event)"
      class="flex items-start gap-3.5 h-full"
    >
      @for (column of columns(); track column.id) {
        <app-board-column
          cdkDrag
          [cdkDragData]="column"
          [column]="column"
          [connectedDropLists]="connectedColumnIds()"
          [isActiveAddCard]="activeAddCardColumnId() === column.id"
          [isAddingCard]="isAddingCard()"
          (cardDropped)="onColumnCardDropped($event, column)"
          (openAddCard)="openAddCard.emit($event)"
          (cancelAddCard)="cancelAddCard.emit()"
          (confirmAddCard)="confirmAddCard.emit($event)"
          (updateColumn)="updateColumn.emit($event)"
          (deleteColumn)="deleteColumn.emit($event)"
          (cardClick)="cardClick.emit($event)"
          (deleteCard)="deleteCard.emit($event)"
          (updateCardTitle)="updateCardTitle.emit($event)"
          (updateCardCover)="updateCardCover.emit($event)"
          (updateCardDatesFromColumn)="updateCardDatesFromBoardCanvas.emit($event)"
        />
      }
    </div>

    <!-- Add Another List Column Action -->
    <div class="w-72 shrink-0">
      @if (isAddingList()) {
        <!--input thêm cột-->
        <div
          class="bg-white dark:bg-slate-900/95 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-lg space-y-2 backdrop-blur-xs min-h-23 flex flex-col justify-between"
        >
          <input
            type="text"
            [ngModel]="newColumnTitle()"
            (ngModelChange)="newColumnTitle.set($event)"
            (keydown.enter)="confirmAddList()"
            (keydown.escape)="cancelAddList()"
            placeholder="Nhập tên danh sách..."
            autofocus
            class="w-full bg-slate-50 dark:bg-slate-950 border border-indigo-500/80 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-white placeholder:text-slate-400 outline-hidden"
          />

          <div class="flex items-center gap-2">
            <button
              type="button"
              (click)="confirmAddList()"
              [disabled]="!newColumnTitle().trim() || isAddingColumn()"
              class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 text-white text-xs font-semibold cursor-pointer transition shadow-xs flex items-center gap-1.5"
            >
              @if (isAddingColumn()) {
                <div
                  class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"
                ></div>
                <span>Đang thêm...</span>
              } @else {
                <span>Thêm cột</span>
              }
            </button>
            <button
              type="button"
              (click)="cancelAddList()"
              class="p-1 rounded-md text-slate-400 hover:text-slate-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700/60 transition cursor-pointer"
            >
              <mat-icon fontIcon="close" class="text-sm! w-4! h-4!"></mat-icon>
            </button>
          </div>
        </div>
      } @else {
        <!-- nút thêm cột-->
        <button
          type="button"
          (click)="openAddList()"
          class="w-full flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-slate-200/50 hover:bg-slate-200/80 dark:bg-slate-900/50 dark:hover:bg-slate-900/80 text-slate-700 dark:text-slate-300 text-xs font-semibold leading-none backdrop-blur-xs transition cursor-pointer shadow-2xs border border-dashed border-slate-300 dark:border-slate-800"
        >
          <mat-icon
            fontIcon="add"
            class="icon-xs shrink-0 flex items-center justify-center leading-none"
          ></mat-icon>
          <span class="leading-none inline-block">Thêm cột mới</span>
        </button>
      }
    </div>
  </div>
}
