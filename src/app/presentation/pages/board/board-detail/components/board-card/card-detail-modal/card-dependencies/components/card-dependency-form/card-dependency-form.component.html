<div
  class="p-3 sm:p-4 rounded-xl bg-slate-50 dark:bg-[#22272b] border border-indigo-200 dark:border-indigo-950/60 space-y-3 animate-in fade-in zoom-in-98 duration-150"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider">
      Thiết lập mối quan hệ
    </span>
    <button
      type="button"
      (click)="closeForm()"
      class="p-1 rounded text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition cursor-pointer"
    >
      <mat-icon fontIcon="close" class="text-xs! w-3.5! h-3.5!"></mat-icon>
    </button>
  </div>

  <!-- Segmented Direction Selector -->
  <div class="grid grid-cols-2 gap-1.5 p-1 rounded-lg bg-slate-200/70 dark:bg-[#1b1f23]">
    <button
      type="button"
      (click)="setDirection('BlockedBy')"
      class="py-1.5 px-2 rounded-md text-xs font-semibold transition cursor-pointer flex items-center justify-center gap-1.5"
      [class.bg-white]="selectedDirection() === 'BlockedBy'"
      [class.dark:bg-[#282e33]]="selectedDirection() === 'BlockedBy'"
      [class.text-rose-600]="selectedDirection() === 'BlockedBy'"
      [class.dark:text-rose-400]="selectedDirection() === 'BlockedBy'"
      [class.shadow-2xs]="selectedDirection() === 'BlockedBy'"
      [class.text-slate-600]="selectedDirection() !== 'BlockedBy'"
      [class.dark:text-slate-400]="selectedDirection() !== 'BlockedBy'"
    >
      <mat-icon fontIcon="block" class="text-xs! w-3.5! h-3.5!"></mat-icon>
      <span>Thẻ này bị chặn bởi...</span>
    </button>

    <button
      type="button"
      (click)="setDirection('Blocking')"
      class="py-1.5 px-2 rounded-md text-xs font-semibold transition cursor-pointer flex items-center justify-center gap-1.5"
      [class.bg-white]="selectedDirection() === 'Blocking'"
      [class.dark:bg-[#282e33]]="selectedDirection() === 'Blocking'"
      [class.text-amber-600]="selectedDirection() === 'Blocking'"
      [class.dark:text-amber-400]="selectedDirection() === 'Blocking'"
      [class.shadow-2xs]="selectedDirection() === 'Blocking'"
      [class.text-slate-600]="selectedDirection() !== 'Blocking'"
      [class.dark:text-slate-400]="selectedDirection() !== 'Blocking'"
    >
      <mat-icon fontIcon="arrow_forward" class="text-xs! w-3.5! h-3.5!"></mat-icon>
      <span>Thẻ này đang chặn...</span>
    </button>
  </div>

  <!-- Search Input -->
  <div class="relative">
    <mat-icon
      fontIcon="search"
      class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm! w-4! h-4!"
    ></mat-icon>
    <input
      type="text"
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Nhập tên thẻ cần liên kết trên bảng..."
      class="w-full pl-8 pr-3 py-1.5 bg-white dark:bg-[#1b1f23] border border-slate-300 dark:border-[#38414a] rounded-lg text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-hidden focus:border-indigo-500 shadow-2xs"
    />
  </div>

  <!-- Candidate List -->
  <div class="max-h-52 overflow-y-auto space-y-1 pr-0.5">
    @if (isSearching()) {
      <div class="py-4 text-center text-xs text-slate-400 flex items-center justify-center gap-2">
        <span
          class="w-3.5 h-3.5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"
        ></span>
        <span>Đang tìm kiếm thẻ khả dụng...</span>
      </div>
    } @else if (candidates().length === 0) {
      <div class="py-4 text-center text-xs text-slate-400">
        Không tìm thấy thẻ nào khả dụng trên bảng này để liên kết.
      </div>
    } @else {
      @for (c of candidates(); track c.id) {
        <button
          type="button"
          (click)="selectCandidate(c)"
          [disabled]="isSubmitting()"
          class="w-full flex items-center justify-between gap-2.5 p-2 rounded-lg bg-white dark:bg-[#1b1f23] hover:bg-indigo-50/70 dark:hover:bg-indigo-950/40 border border-slate-200/80 dark:border-[#38414a]/80 hover:border-indigo-400 dark:hover:border-indigo-600 transition cursor-pointer text-left group"
        >
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <mat-icon
              [fontIcon]="getTypeIcon(c.type)"
              class="text-xs! w-3.5! h-3.5! shrink-0"
              [ngClass]="getTypeColorClass(c.type)"
            ></mat-icon>
            <span
              class="text-xs font-medium text-slate-800 dark:text-slate-200 truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400"
            >
              {{ c.title }}
            </span>
            @if (c.columnTitle) {
              <span class="text-[10px] text-slate-400 dark:text-slate-500 shrink-0">
                ({{ c.columnTitle }})
              </span>
            }
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            @if (c.isDone) {
              <span
                class="px-1.5 py-0.2 rounded text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800"
              >
                Đã xong
              </span>
            }
            <span
              class="px-1.5 py-0.2 rounded text-[10px] font-semibold border"
              [ngClass]="getPriorityClass(c.priority)"
            >
              {{ c.priority }}
            </span>
            @if (c.assigneeName) {
              <span class="text-[11px] text-slate-400 hidden sm:inline">
                {{ c.assigneeName }}
              </span>
            }
          </div>
        </button>
      }
    }
  </div>
</div>
