<!-- Board Detail Canvas (Modern SaaS Project Theme) -->
<div
  class="flex-1 h-full w-full flex flex-col bg-slate-100/90 dark:bg-slate-950 text-slate-900 dark:text-white relative overflow-hidden select-none min-h-0 transition-colors duration-200"
  style="display: flex; flex-direction: column; flex: 1; height: 100%; min-height: 0"
>
  <!-- Atmospheric Ambient Glows (Matches Workspace / Project Brand Theme) -->
  <div
    class="pointer-events-none absolute -top-40 -right-40 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-600/10 rounded-full blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -bottom-40 -left-40 w-96 h-96 bg-purple-500/10 dark:bg-purple-600/10 rounded-full blur-3xl"
  ></div>

  <!-- 1. Top Board Header Sub-Component -->
  <app-board-header
    [board]="currentBoard()"
    (togglePin)="onToggleBoardPin()"
    (openMenu)="openBoardMenu()"
  />

  <!-- 2. Main Kanban Board Canvas (Columns & Cards Body) -->
  <main class="flex-1 overflow-x-auto overflow-y-hidden p-4 pb-20 flex items-start gap-3.5 min-h-0">
    @if (error()) {
      <!-- Error State: Căn giữa màn hình hoàn hảo cả chiều dọc và chiều ngang -->
      <div class="flex-1 w-full h-full self-stretch flex items-center justify-center p-4">
        <div
          class="p-6 bg-white dark:bg-slate-900 border border-rose-300 dark:border-rose-500/40 rounded-2xl shadow-xl text-center max-w-md w-full shadow-rose-500/5"
        >
          <mat-icon
            fontIcon="error_outline"
            class="text-rose-500 dark:text-rose-400 text-3xl! w-8! h-8! mb-2"
          ></mat-icon>
          <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">
            Không thể tải bảng
          </h3>
          <p class="text-xs text-slate-600 dark:text-slate-300 mb-4">{{ error() }}</p>
          <button
            type="button"
            (click)="onRetry()"
            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold cursor-pointer shadow-sm transition"
          >
            Thử lại
          </button>
        </div>
      </div>
    } @else {
      <app-board-canvas
        class="h-full flex items-start"
        [columns]="columns()"
        [isLoading]="isLoading()"
        [error]="error()"
        [activeAddCardColumnId]="activeAddCardColumnId()"
        [isAddingCard]="boardStore.isAddingCard()"
        [isAddingColumn]="boardStore.isAddingColumn()"
        (retry)="onRetry()"
        (cardDrop)="onCardDrop($event)"
        (columnDrop)="onColumnDrop($event)"
        (openAddCard)="openAddCard($event)"
        (cancelAddCard)="cancelAddCard()"
        (confirmAddCard)="confirmAddCard($event)"
        (addColumn)="confirmAddColumn($event)"
        (updateColumn)="onUpdateColumn($event)"
        (deleteColumn)="onDeleteColumn($event)"
        (cardClick)="onCardClick($event)"
        (deleteCard)="onDeleteCard($event)"
        (updateCardTitle)="onUpdateCardTitle($event)"
      />
    }
  </main>

  <!-- 3. Board Footer Bar ("cái chân board") -->
  <div
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-white/95 dark:bg-slate-900/90 backdrop-blur-md border border-slate-200 dark:border-slate-800/90 rounded-xl px-1.5 py-1 shadow-lg dark:shadow-2xl flex items-center gap-1"
  >
    <!-- Item 1: Board (Active Tab) -->
    <button
      type="button"
      class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold leading-none bg-indigo-50 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30 transition shadow-xs cursor-default"
    >
      <mat-icon fontIcon="dashboard" class="icon-xs shrink-0"></mat-icon>
      <span class="leading-none inline-block">Board</span>
    </button>

    <!-- Item 2: Switch boards (Opens Modal as requested) -->
    <button
      type="button"
      (click)="openSwitchBoardModal()"
      class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium leading-none text-slate-600 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800/80 transition cursor-pointer"
    >
      <mat-icon fontIcon="swap_horiz" class="icon-xs shrink-0"></mat-icon>
      <span class="leading-none inline-block">Switch boards</span>
    </button>
  </div>

  <!-- Switch Board Modal -->
  @if (showSwitchBoardModal()) {
    <app-switch-board-modal
      [boards]="projectBoards()"
      [activeBoardSlug]="currentBoard()?.slug || ''"
      [currentProjectName]="currentBoard()?.projectName || ''"
      (selectBoard)="onSelectBoardFromModal($event)"
      (togglePin)="onTogglePinFromModal($event)"
      (close)="closeSwitchBoardModal()"
    />
  }

  <!-- Board Menu Drawer (Right-side Panel) -->
  <app-board-menu-drawer
    [isOpen]="showBoardMenu()"
    [board]="currentBoard()"
    [isProjectLeader]="isProjectLeader()"
    (closed)="closeBoardMenu()"
    (openEditBoard)="openEditBoardModal()"
    (openDeleteBoard)="openDeleteBoardModal()"
    (leaveBoard)="onLeaveBoard()"
  />

  <!-- Board Settings Modal (Cập nhật thông tin bảng) -->
  <app-board-settings-modal
    [isOpen]="showEditBoardModal()"
    [board]="currentBoard()"
    (closed)="closeEditBoardModal()"
    (saved)="onBoardUpdated($event)"
  />

  <!-- Board Delete Modal (Xóa bảng - Chỉ cho ProjectLeader) -->
  <app-board-delete-modal
    [isOpen]="showDeleteBoardModal()"
    [board]="currentBoard()"
    (closed)="closeDeleteBoardModal()"
    (deleted)="onBoardDeleted()"
  />

  <!-- Card Detail Modal (Xem & chỉnh sửa chi tiết thẻ) -->
  @if (showCardDetailModal() && selectedCardForDetail()) {
    <app-card-detail-modal
      [isOpen]="showCardDetailModal()"
      [card]="selectedCardForDetail()!"
      [cardDetail]="boardStore.currentCardDetail()"
      [isLoading]="boardStore.isLoadingCardDetail()"
      [columns]="columns()"
      [members]="projectMembers()"
      (closed)="closeCardDetailModal()"
      (columnChanged)="onCardDetailColumnChanged($event)"
      (titleChanged)="onCardDetailTitleChanged($event)"
      (descriptionChanged)="onCardDetailDescriptionChanged($event)"
      (coverChanged)="onCardDetailCoverChanged($event)"
      (commentAdded)="onCardDetailCommentAdded($event)"
      (priorityChanged)="onCardDetailPriorityChanged($event)"
      (typeChanged)="onCardDetailTypeChanged($event)"
      (datesChanged)="onCardDetailDatesChanged($event)"
      (assigneeChanged)="onCardDetailAssigneeChanged($event)"
      (progressChanged)="onCardDetailProgressChanged($event)"
    />
  }
</div>
