@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs animate-in fade-in duration-150"
    (click)="close()"
  >
    <div
      class="bg-white dark:bg-[#111827] rounded-2xl border border-slate-200 dark:border-slate-800 max-w-lg w-full shadow-2xl overflow-hidden animate-in zoom-in-95 duration-150 flex flex-col"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div
        class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-start justify-between shrink-0"
      >
        <div class="flex items-start gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-linear-to-br from-indigo-500 to-indigo-700 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 shrink-0 mt-0.5"
          >
            <mat-icon fontIcon="rocket_launch" class="text-xl"></mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 dark:text-white text-base">
              Tạo Sprint mới
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              Lập một đợt chạy nước rút có giới hạn thời gian theo chu kỳ Scrum.
            </p>
          </div>
        </div>
        <button
          type="button"
          (click)="close()"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
        >
          <mat-icon fontIcon="close" class="text-sm! w-4! h-4!"></mat-icon>
        </button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-5 space-y-4">
        <!-- Tên Sprint -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Tên Sprint <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="Ví dụ: Sprint 1 - Khởi động dự án"
            class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
          />
          @if (form.controls.name.touched && form.controls.name.errors) {
            <p class="text-[11px] mt-1 text-rose-500">Tên Sprint phải từ 2 đến 100 ký tự.</p>
          }
        </div>

        <!-- Thời lượng Sprint (Duration Quick Selector) -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Thời lượng đợt chạy
          </label>
          <div class="grid grid-cols-4 gap-2">
            @for (weeks of [1, 2, 3, 4]; track weeks) {
              <button
                type="button"
                (click)="onDurationChange(weeks)"
                class="py-2 text-xs font-medium rounded-xl border text-center transition cursor-pointer"
                [class.border-indigo-600]="form.controls.duration.value === weeks"
                [class.bg-indigo-50]="form.controls.duration.value === weeks"
                [class.text-indigo-600]="form.controls.duration.value === weeks"
                [class.dark:bg-indigo-950/40]="form.controls.duration.value === weeks"
                [class.dark:text-indigo-400]="form.controls.duration.value === weeks"
                [class.dark:border-indigo-500]="form.controls.duration.value === weeks"
                [class.border-slate-200]="form.controls.duration.value !== weeks"
                [class.dark:border-slate-700]="form.controls.duration.value !== weeks"
                [class.text-slate-600]="form.controls.duration.value !== weeks"
                [class.dark:text-slate-300]="form.controls.duration.value !== weeks"
              >
                {{ weeks }} tuần
              </button>
            }
          </div>
        </div>

        <!-- Ngày bắt đầu và kết thúc -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Ngày bắt đầu
            </label>
            <input
              type="date"
              formControlName="startDate"
              (change)="onStartDateChange()"
              class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
              Ngày kết thúc
            </label>
            <input
              type="date"
              formControlName="endDate"
              class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition"
            />
          </div>
        </div>

        <!-- Mục tiêu Sprint (Sprint Goal) -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Mục tiêu Sprint (Sprint Goal)
          </label>
          <textarea
            formControlName="goal"
            rows="3"
            placeholder="Mục tiêu chính mà cả nhóm cần đạt được trong đợt chạy này..."
            class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition resize-none"
          ></textarea>
        </div>

        <!-- Footer Actions -->
        <div
          class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-3"
        >
          <button
            type="button"
            (click)="close()"
            class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
          >
            Hủy
          </button>
          <button
            type="submit"
            [disabled]="sprintStore.isCreatingSprint() || form.invalid"
            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 transition cursor-pointer shadow-md shadow-indigo-600/20"
          >
            @if (sprintStore.isCreatingSprint()) {
              <div
                class="w-3.5 h-3.5 border-2 border-white/20 border-t-white rounded-full animate-spin"
              ></div>
              <span>Đang tạo...</span>
            } @else {
              <mat-icon fontIcon="add" class="text-sm! w-4! h-4!"></mat-icon>
              <span>Tạo Sprint</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
