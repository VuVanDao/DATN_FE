<div class="max-w-7xl mx-auto space-y-6 pb-12 w-full min-w-0">
  @if (projectStore.isLoading()) {
    <!-- Skeleton Loading -->
    <div class="animate-pulse space-y-6">
      <div class="h-6 w-36 bg-slate-800 rounded"></div>
      <div class="h-44 w-full rounded-2xl bg-slate-800"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="h-24 rounded-2xl bg-slate-800"></div>
        }
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 h-72 rounded-2xl bg-slate-800"></div>
        <div class="h-72 rounded-2xl bg-slate-800"></div>
      </div>
    </div>
  } @else if (detailError(); as error) {
    <div role="alert" class="rounded-2xl border border-slate-800 bg-slate-900 p-8 space-y-4">
      <h1 class="text-lg font-semibold text-white">Không thể tải thông tin dự án</h1>
      <p class="text-sm text-rose-400">{{ error }}</p>
      <div class="flex items-center gap-4">
        @if (!routeError()) {
          <button
            type="button"
            (click)="loadProjectDetail()"
            class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 cursor-pointer"
          >
            Thử lại
          </button>
        }
        <button
          type="button"
          (click)="goBack()"
          class="text-sm font-semibold text-slate-300 hover:text-white cursor-pointer"
        >
          Quay lại
        </button>
      </div>
    </div>
  } @else if (projectView(); as proj) {
    <!-- 1. Top Navigation & Hero Banner with Stats -->
    <app-project-hero-header
      class="block"
      [project]="proj"
      (back)="goBack()"
      (addMember)="openAddMemberModal()"
      (openSettings)="openSettingsModal()"
    />

    <!-- 2. Main Two-Column Layout (Trái: Danh sách Bảng, Phải: Danh sách Thành viên) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- LEFT COLUMN: QUẢN LÝ BẢNG CÔNG VIỆC (col-span-2) -->
      <app-project-boards
        class="block lg:col-span-2"
        [boards]="boards()"
        [isLoading]="projectStore.isLoadingBoards()"
        [canCreateBoard]="isCurrentLeader()"
        (createBoard)="openCreateBoardModal()"
        (boardClick)="onBoardClick($event)"
        (togglePin)="onTogglePin($event)"
      />

      <!-- RIGHT COLUMN: DANH SÁCH THÀNH VIÊN (col-span-1) -->
      <app-project-members
        class="block space-y-6"
        [members]="members()"
        [totalCount]="proj.membersCount"
        [currentUserId]="currentUserId()"
        [isWorkspaceOwner]="isWorkspaceOwner()"
        [isCurrentLeader]="isCurrentLeader()"
        [canManageRoles]="canManageRoles()"
        [isBusy]="isMemberActionBusy()"
        [canRemoveMemberFn]="canRemoveMemberBound"
        [canChangeRoleFn]="canChangeRoleBound"
        (addMember)="openAddMemberModal()"
        (changeRole)="openChangeRoleModal($event)"
        (removeMember)="openRemoveMember($event)"
      />
    </div>

    <!-- Modals -->
    <!-- Modal đổi vai trò / chức danh thành viên -->
    <app-change-project-member-modal
      [isOpen]="!!memberToChangeRole()"
      [member]="memberToChangeRole()"
      [projectName]="proj.name"
      [roles]="projectStore.roles()"
      [isUpdating]="projectStore.isUpdatingMemberRole() || projectStore.isUpdatingMemberJobTitle()"
      [errorMessage]="changeRoleError()"
      (closed)="closeChangeRoleModal()"
      (confirmed)="confirmChangeRole($event)"
    />

    <!-- Modal xác nhận xóa / rời dự án -->
    <app-remove-project-member-modal
      [isOpen]="!!memberToRemove()"
      [member]="memberToRemove()"
      [projectName]="proj.name"
      [isSelf]="memberToRemove() ? isSelf(memberToRemove()!) : false"
      [isRemoving]="projectStore.isRemovingMember()"
      [errorMessage]="memberRemovalError()"
      (closed)="closeRemoveMember()"
      (confirmed)="confirmRemoveMember()"
    />

    <!-- Modal Cài đặt chi tiết dự án -->
    <app-project-settings-modal
      [isOpen]="showSettingsModal()"
      [project]="project()"
      (closed)="closeSettingsModal()"
      (saved)="onProjectUpdated($event)"
      (deleted)="onProjectDeleted($event)"
    />

    <!-- Modal Thêm thành viên -->
    <app-add-project-member-modal
      [isOpen]="showAddMemberModal()"
      [projectId]="proj.id"
      [workspaceId]="proj.workspaceId"
      (closed)="closeAddMemberModal()"
    />

    <!-- Modal Tạo Board mới -->
    <app-create-board-modal
      [isOpen]="showCreateBoardModal()"
      [projectId]="proj.id"
      (closed)="closeCreateBoardModal()"
    />
  }
</div>
