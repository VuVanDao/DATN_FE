<div class="max-w-7xl mx-auto space-y-6 pb-12 w-full min-w-0">
  @if (projectStore.isLoading()) {
    <!-- Skeleton Loading -->
    <div class="animate-pulse space-y-6">
      <div class="h-6 w-36 bg-slate-800 rounded"></div>
      <div class="h-44 w-full rounded-2xl bg-slate-800"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="h-24 rounded-2xl bg-slate-800"></div>
        }
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 h-72 rounded-2xl bg-slate-800"></div>
        <div class="h-72 rounded-2xl bg-slate-800"></div>
      </div>
    </div>
  } @else if (detailError(); as error) {
    <div role="alert" class="rounded-2xl border border-slate-800 bg-slate-900 p-8 space-y-4">
      <h1 class="text-lg font-semibold text-white">Không thể tải thông tin dự án</h1>
      <p class="text-sm text-rose-400">{{ error }}</p>
      <div class="flex items-center gap-4">
        @if (!routeError()) {
          <button
            type="button"
            (click)="loadProjectDetail()"
            class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 cursor-pointer"
          >
            Thử lại
          </button>
        }
        <button
          type="button"
          (click)="goBack()"
          class="text-sm font-semibold text-slate-300 hover:text-white cursor-pointer"
        >
          Quay lại
        </button>
      </div>
    </div>
  } @else if (projectView(); as proj) {
    <!-- 1. Top Navigation & Hero Banner with Stats -->
    <app-project-hero-header
      class="block"
      [project]="proj"
      (back)="goBack()"
      (addMember)="openAddMemberModal()"
      (openSettings)="openSettingsModal()"
      (selectTab)="activeMainTab.set($event)"
    />

    <!-- 2. Main Navigation Tabs (Bảng công việc & Thành viên dự án) -->
    <div class="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800">
      <!-- Tab: Bảng công việc -->
      <button
        type="button"
        (click)="activeMainTab.set('boards')"
        class="inline-flex items-center gap-2 px-4 py-3 text-sm font-semibold border-b-2 transition cursor-pointer -mb-px select-none"
        [class.border-indigo-600]="activeMainTab() === 'boards'"
        [class.text-indigo-600]="activeMainTab() === 'boards'"
        [class.dark:text-indigo-400]="activeMainTab() === 'boards'"
        [class.dark:border-indigo-400]="activeMainTab() === 'boards'"
        [class.border-transparent]="activeMainTab() !== 'boards'"
        [class.text-slate-500]="activeMainTab() !== 'boards'"
        [class.dark:text-slate-400]="activeMainTab() !== 'boards'"
        [class.hover:text-slate-900]="activeMainTab() !== 'boards'"
        [class.dark:hover:text-white]="activeMainTab() !== 'boards'"
      >
        <mat-icon fontIcon="dashboard" class="text-base! w-auto! h-auto!"></mat-icon>
        <span>Bảng công việc</span>
        <span
          class="text-xs px-2 py-0.5 rounded-full font-medium"
          [class.bg-indigo-100]="activeMainTab() === 'boards'"
          [class.dark:bg-indigo-500/20]="activeMainTab() === 'boards'"
          [class.text-indigo-700]="activeMainTab() === 'boards'"
          [class.dark:text-indigo-300]="activeMainTab() === 'boards'"
          [class.bg-slate-100]="activeMainTab() !== 'boards'"
          [class.dark:bg-slate-800]="activeMainTab() !== 'boards'"
          [class.text-slate-600]="activeMainTab() !== 'boards'"
          [class.dark:text-slate-400]="activeMainTab() !== 'boards'"
        >
          {{ boards().length }}
        </span>
      </button>

      <!-- Tab: Thành viên dự án -->
      <button
        type="button"
        (click)="activeMainTab.set('members')"
        class="inline-flex items-center gap-2 px-4 py-3 text-sm font-semibold border-b-2 transition cursor-pointer -mb-px select-none"
        [class.border-indigo-600]="activeMainTab() === 'members'"
        [class.text-indigo-600]="activeMainTab() === 'members'"
        [class.dark:text-indigo-400]="activeMainTab() === 'members'"
        [class.dark:border-indigo-400]="activeMainTab() === 'members'"
        [class.border-transparent]="activeMainTab() !== 'members'"
        [class.text-slate-500]="activeMainTab() !== 'members'"
        [class.dark:text-slate-400]="activeMainTab() !== 'members'"
        [class.hover:text-slate-900]="activeMainTab() !== 'members'"
        [class.dark:hover:text-white]="activeMainTab() !== 'members'"
      >
        <mat-icon fontIcon="group" class="text-base! w-auto! h-auto!"></mat-icon>
        <span>Thành viên dự án</span>
        <span
          class="text-xs px-2 py-0.5 rounded-full font-medium"
          [class.bg-indigo-100]="activeMainTab() === 'members'"
          [class.dark:bg-indigo-500/20]="activeMainTab() === 'members'"
          [class.text-indigo-700]="activeMainTab() === 'members'"
          [class.dark:text-indigo-300]="activeMainTab() === 'members'"
          [class.bg-slate-100]="activeMainTab() !== 'members'"
          [class.dark:bg-slate-800]="activeMainTab() !== 'members'"
          [class.text-slate-600]="activeMainTab() !== 'members'"
          [class.dark:text-slate-400]="activeMainTab() !== 'members'"
        >
          {{ proj.membersCount || members().length }}
        </span>
      </button>
    </div>

    <!-- 3. Tab Content Panels -->
    <!-- PANEL 1: QUẢN LÝ BẢNG CÔNG VIỆC -->
    <app-project-boards
      class="block"
      [class.hidden]="activeMainTab() !== 'boards'"
      [boards]="boards()"
      [isLoading]="projectStore.isLoadingBoards()"
      [canCreateBoard]="isCurrentLeader()"
      (createBoard)="openCreateBoardModal()"
      (boardClick)="onBoardClick($event)"
      (togglePin)="onTogglePin($event)"
    />

    <!-- PANEL 2: DANH SÁCH THÀNH VIÊN -->
    <app-project-members
      class="block"
      [class.hidden]="activeMainTab() !== 'members'"
      [members]="members()"
      [totalCount]="proj.membersCount"
      [currentUserId]="currentUserId()"
      [isWorkspaceOwner]="isWorkspaceOwner()"
      [isCurrentLeader]="isCurrentLeader()"
      [canManageRoles]="canManageRoles()"
      [isBusy]="isMemberActionBusy()"
      [canRemoveMemberFn]="canRemoveMemberBound"
      [canChangeRoleFn]="canChangeRoleBound"
      (addMember)="openAddMemberModal()"
      (changeRole)="openChangeRoleModal($event)"
      (removeMember)="openRemoveMember($event)"
    />

    <!-- Modals -->
    <!-- Modal đổi vai trò / chức danh thành viên -->
    <app-change-project-member-modal
      [isOpen]="!!memberToChangeRole()"
      [member]="memberToChangeRole()"
      [projectName]="proj.name"
      [roles]="projectStore.roles()"
      [isUpdating]="projectStore.isUpdatingMemberRole() || projectStore.isUpdatingMemberJobTitle()"
      [errorMessage]="changeRoleError()"
      (closed)="closeChangeRoleModal()"
      (confirmed)="confirmChangeRole($event)"
    />

    <!-- Modal xác nhận xóa / rời dự án -->
    <app-remove-project-member-modal
      [isOpen]="!!memberToRemove()"
      [member]="memberToRemove()"
      [projectName]="proj.name"
      [isSelf]="memberToRemove() ? isSelf(memberToRemove()!) : false"
      [isRemoving]="projectStore.isRemovingMember()"
      [errorMessage]="memberRemovalError()"
      (closed)="closeRemoveMember()"
      (confirmed)="confirmRemoveMember()"
    />

    <!-- Modal Cài đặt chi tiết dự án -->
    <app-project-settings-modal
      [isOpen]="showSettingsModal()"
      [project]="project()"
      (closed)="closeSettingsModal()"
      (saved)="onProjectUpdated($event)"
      (deleted)="onProjectDeleted($event)"
    />

    <!-- Modal Thêm thành viên -->
    <app-add-project-member-modal
      [isOpen]="showAddMemberModal()"
      [projectId]="proj.id"
      [workspaceId]="proj.workspaceId"
      (closed)="closeAddMemberModal()"
    />

    <!-- Modal Tạo Board mới -->
    <app-create-board-modal
      [isOpen]="showCreateBoardModal()"
      [projectId]="proj.id"
      (closed)="closeCreateBoardModal()"
    />
  }
</div>
